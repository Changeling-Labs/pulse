<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Pulse" />
  <meta name="theme-color" content="#0B111E" />
  <title>Pulse — Engineered for Healthspan</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div id="app">
  <header id="header">
    <button id="header-back" aria-label="Go back">‹</button>
    <img src="icons/pulse-mark.svg" alt="" width="34" height="26" style="flex-shrink:0" aria-hidden="true" />
    <h1>Pulse</h1>
    <button id="header-action" aria-label="More options" class="hidden">⋯</button>
  </header>

  <main id="content" aria-live="polite">
    <div class="empty"><p>Loading…</p></div>
  </main>

  <nav id="nav" aria-label="Main navigation">
    <button class="nav-btn active" data-tab="log" aria-label="Log">
      <span class="icon">✏️</span><span>Log</span>
    </button>
    <button class="nav-btn" data-tab="fuel" aria-label="Fuel">
      <span class="icon">🥗</span><span>Fuel</span>
    </button>
    <button class="nav-btn" data-tab="prs" aria-label="Personal Records">
      <span class="icon">🏆</span><span>PRs</span>
    </button>
    <button class="nav-btn" data-tab="planner" aria-label="Session Planner">
      <span class="icon">📋</span><span>Planner</span>
    </button>
    <button class="nav-btn" data-tab="settings" aria-label="Settings">
      <span class="icon">⚙️</span><span>Settings</span>
    </button>
  </nav>
</div>

<button id="fab" aria-label="Log a set">+</button>

<!-- Rest timer bar: shown while a rest is counting down -->
<div class="rest-bar hidden" id="rest-bar">
  <div class="rest-progress"><div class="rest-fill" id="rest-fill"></div></div>
  <div class="rest-row">
    <div class="rest-info">
      <span class="rest-round hidden" id="rest-round">Round 1/3</span>
      <span class="rest-clock" id="rest-clock">0:00</span>
    </div>
    <div class="rest-actions">
      <button type="button" class="btn btn-ghost rest-btn" onclick="extendRest(30)">+30s</button>
      <button type="button" class="btn btn-ghost rest-btn" id="rest-pause" onclick="toggleRestPause()">Pause</button>
      <button type="button" class="btn btn-ghost rest-btn" onclick="skipRest()">Skip</button>
    </div>
  </div>
</div>

<!-- Log set modal -->
<div class="modal-overlay" id="log-modal" role="dialog" aria-modal="true" aria-label="Log a set">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Log a set</div>

    <div class="mode-toggle">
      <button type="button" class="mode-btn active" data-mode="single" onclick="setLogMode('single')">Single set</button>
      <button type="button" class="mode-btn" data-mode="circuit" onclick="setLogMode('circuit')">Circuit</button>
    </div>

    <!-- Single set: one exercise, one set -->
    <div id="modal-single">
      <div class="form-row">
        <label for="modal-exercise">Exercise</label>
        <select id="modal-exercise" onchange="onLogExerciseChange(this.value)"></select>
      </div>

      <!-- Inputs are rendered from the selected exercise's metric (see schema.js) -->
      <div id="modal-metrics"></div>
    </div>

    <!-- Circuit: 2+ exercises logged together for N rounds -->
    <div id="modal-circuit" class="hidden">
      <div class="form-row">
        <label for="circuit-add">Add exercise</label>
        <select id="circuit-add" onchange="addCircuitItem(this.value); this.value=''"></select>
      </div>
      <div id="circuit-list"></div>
      <div class="metric-block">
        <div class="metric-head"><span class="metric-label">Rounds</span></div>
        <div class="stepper">
          <button type="button" class="step-btn" onclick="stepRounds(-1)" aria-label="Fewer rounds">−1</button>
          <input type="number" id="circuit-rounds" class="step-value" inputmode="numeric" min="1" max="20" value="3" />
          <button type="button" class="step-btn" onclick="stepRounds(1)" aria-label="More rounds">+1</button>
        </div>
      </div>
      <div class="form-row">
        <label for="circuit-rest">Rest between rounds</label>
        <select id="circuit-rest" onchange="setCircuitRest(this.value)"></select>
      </div>
    </div>

    <div class="form-row">
      <label for="modal-notes">Notes</label>
      <input type="text" id="modal-notes" placeholder="Optional" />
    </div>

    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-full" onclick="closeLogModal()">Cancel</button>
      <button class="btn btn-primary btn-full" onclick="submitLog()">Save</button>
    </div>
  </div>
</div>

<!-- Fuel modal: hand-portion estimator + whole-food flag -->
<div class="modal-overlay" id="fuel-modal" role="dialog" aria-modal="true" aria-label="Log fuel">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="fuel-modal-title">Log fuel</div>

    <div class="metric-block">
      <div class="metric-head"><span class="metric-label">Hand portions</span></div>
      <div class="portion-grid">
        <div class="portion-tile">
          <span class="portion-emoji">🥩</span>
          <span class="portion-name">Palm</span>
          <span class="portion-sub">~25g protein</span>
          <div class="portion-stepper">
            <button type="button" onclick="adjustPortion('palms', -1)" aria-label="Fewer palms">−</button>
            <span class="portion-count" id="portion-palms">0</span>
            <button type="button" onclick="adjustPortion('palms', 1)" aria-label="More palms">+</button>
          </div>
        </div>
        <div class="portion-tile">
          <span class="portion-emoji">🥦</span>
          <span class="portion-name">Fist</span>
          <span class="portion-sub">vegetables · quality</span>
          <div class="portion-stepper">
            <button type="button" onclick="adjustPortion('fists', -1)" aria-label="Fewer fists">−</button>
            <span class="portion-count" id="portion-fists">0</span>
            <button type="button" onclick="adjustPortion('fists', 1)" aria-label="More fists">+</button>
          </div>
        </div>
        <div class="portion-tile">
          <span class="portion-emoji">🍚</span>
          <span class="portion-name">Cupped</span>
          <span class="portion-sub">~15g carbs</span>
          <div class="portion-stepper">
            <button type="button" onclick="adjustPortion('cupped', -1)" aria-label="Fewer cupped hands">−</button>
            <span class="portion-count" id="portion-cupped">0</span>
            <button type="button" onclick="adjustPortion('cupped', 1)" aria-label="More cupped hands">+</button>
          </div>
        </div>
        <div class="portion-tile">
          <span class="portion-emoji">🥜</span>
          <span class="portion-name">Thumb</span>
          <span class="portion-sub">~10g fat</span>
          <div class="portion-stepper">
            <button type="button" onclick="adjustPortion('thumbs', -1)" aria-label="Fewer thumbs">−</button>
            <span class="portion-count" id="portion-thumbs">0</span>
            <button type="button" onclick="adjustPortion('thumbs', 1)" aria-label="More thumbs">+</button>
          </div>
        </div>
      </div>
      <div class="fuel-estimate" id="fuel-estimate"><b>0 g</b> protein · <b>0</b> kcal</div>
    </div>

    <div class="metric-block">
      <div class="metric-head"><span class="metric-label">Whole food?</span><span class="metric-unit" id="fuel-whole-hint">Minimally processed</span></div>
      <div class="mode-toggle">
        <button type="button" class="mode-btn active" id="whole-yes" onclick="setFuelWholeFood(true)">Yes</button>
        <button type="button" class="mode-btn" id="whole-no" onclick="setFuelWholeFood(false)">No — packaged/processed</button>
      </div>
    </div>

    <div class="form-row">
      <label for="fuel-notes">Notes</label>
      <input type="text" id="fuel-notes" placeholder="Optional" />
    </div>

    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-full" onclick="closeFuelModal()">Cancel</button>
      <button class="btn btn-primary btn-full" onclick="submitFuelLog()">Save</button>
    </div>
  </div>
</div>

<script>
  document.getElementById('fuel-modal').addEventListener('click', function(e) {
    if (e.target === this) closeFuelModal();
  });
</script>

<script>
  document.getElementById('log-modal').addEventListener('click', function(e) {
    if (e.target === this) closeLogModal();
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

<script src="./js/vendor/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
