<!--
  Pulse — Supabase email template for BOTH:
    Authentication → Email Templates → Magic Link
    Authentication → Email Templates → Confirm signup

  Paste this body into both. It deliberately has no {{ .ConfirmationURL }}.
  A link in the same email can be tapped — or prefetched by a mail scanner —
  and consume the one-time token before the user types the code.

  Subject suggestion: Your Pulse sign-in code
-->
<h2>Your Pulse sign-in code</h2>
<p>Enter this code in Pulse:</p>
<p style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 30px; font-weight: 700; letter-spacing: 8px; margin: 24px 0;">
  {{ .Token }}
</p>
<p>
  The code signs in the copy of Pulse you are using — including the installed
  app on your phone. It expires after a short time and can only be used once.
</p>
<p>If you did not request this, you can ignore this email.</p>
